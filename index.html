<!DOCTYPE html>
<html lang="en" data-theme="light" style="color-scheme:light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inspiration Compass</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4EF;--panel:#FFFFFF;--line:#E6E0D6;--ink:#24221F;--muted:#625B52;--tint:#EFEAE1;--red:#C1272D;--stone:#9C947C;--stoneT:#6F6853;--char:#4B4A4E;--amber:#D98A1C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Archivo",Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;min-height:100%}
button,input,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{display:block;height:23px;width:auto}
.top h1{font-size:16px;font-weight:600}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
#hflame{display:inline-block;transition:transform .8s cubic-bezier(.34,1.56,.64,1);transform-origin:50% 90%}
.col{max-width:700px;margin:0 auto;padding:20px 20px 64px}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin-bottom:14px}
.steps li{flex:1;font-size:12.5px;color:var(--muted);border-top:3px solid var(--line);padding-top:6px}
.steps li.done{color:var(--ink);border-top-color:var(--ink)}
.steps li.now{color:var(--ink);font-weight:600;border-top-color:var(--red)}
.steps li.click{cursor:pointer}
.chapline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--red);margin-bottom:10px}
.chapline .left{color:var(--muted);letter-spacing:0;text-transform:none;font-weight:500}
#dialwrap{display:flex;justify-content:center;margin:0 auto 6px;transition:max-width .5s}
#dialwrap.big{max-width:500px}#dialwrap.mid{max-width:300px}
#dial{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;margin:0 auto 18px;max-width:520px;font-size:13.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend svg{flex:none}
.ptr{transform-origin:0 0;transform-box:view-box;transition:transform 1s cubic-bezier(.34,1.56,.64,1),opacity .4s}
.ptr polygon{stroke:var(--panel);stroke-width:2.5}
.ptr.idle{animation:seek 6s ease-in-out infinite}
@keyframes seek{0%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}100%{transform:rotate(-30deg)}}
h2{font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.01em;margin-bottom:10px}
.lead{color:var(--muted);font-size:17px;margin-bottom:20px}
.statement{font-size:30px;line-height:1.2;font-weight:700;color:var(--red);letter-spacing:-.01em;margin:6px 0 26px}
.big{font-size:22px;line-height:1.3;font-weight:700;margin-bottom:6px}
.card{background:var(--panel);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(36,34,31,.05)}
.scenario{font-size:17px;line-height:1.55;margin-bottom:14px}
.q{font-weight:600;font-size:17px;margin-bottom:12px}
.pick{width:100%;min-height:48px;text-align:left;background:var(--panel);border:1px solid transparent;border-radius:12px;padding:13px 16px;margin-bottom:8px;cursor:pointer;display:flex;gap:12px;align-items:center;font-size:16px;box-shadow:0 1px 2px rgba(36,34,31,.05)}
.pick:hover{border-color:var(--line)}
.pick .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.pick.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--tint)}
.pick.on::after{content:"✓";margin-left:auto;font-weight:700}
.pick[disabled]{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;border:1.5px solid var(--c,var(--line));background:var(--panel);color:var(--ink);border-radius:22px;padding:8px 15px;font-size:15px;cursor:pointer}
.chip.on{background:var(--c,var(--ink));color:#fff;border-color:var(--c,var(--ink))}
.chip[disabled]{opacity:.4;cursor:default}
.chip.x::after{content:" ×";opacity:.7}
.meta{font-size:14px;color:var(--muted)}
.lock{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--muted);margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px}
.txt{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 13px;margin-top:8px;resize:vertical}
.fieldhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mic{min-height:40px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.mic.on{background:var(--red);color:#fff;border-color:var(--red)}
.video{display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--panel);border-radius:16px;padding:18px 20px}
.video .play{width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.video small{display:block;opacity:.75;font-size:13.5px}
.ask{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.ask span{flex:none;width:96px;font-weight:600;color:var(--red)}
.reveal{background:var(--panel);border-radius:16px;padding:18px 20px;margin-top:12px;box-shadow:0 1px 2px rgba(36,34,31,.05)}
.tag{display:inline-block;font-size:13px;font-weight:600;border-radius:12px;padding:3px 10px;margin:4px 6px 0 0;color:#fff}
.banner{display:flex;gap:12px;align-items:flex-start;background:#FFF4D6;color:#3D3218;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14.5px}
.banner b{display:block}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.views div{background:var(--panel);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(36,34,31,.05)}
.views b{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.views i{display:inline-block;width:14px;height:4px;border-radius:2px}
.views span{font-size:15px;line-height:1.45}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 8px}
.stage{background:var(--panel);border-radius:14px;padding:14px;position:relative;box-shadow:0 1px 2px rgba(36,34,31,.05)}
.stage .bar{height:6px;border-radius:3px;margin-bottom:10px}
.stage b{display:block;font-size:16px}.stage small{display:block;color:var(--muted);font-size:13px;margin-top:2px}.stage p{font-size:13.5px;margin-top:8px;color:var(--muted)}
.stage.here{box-shadow:inset 0 0 0 2px var(--red)}
.here-tag{position:absolute;top:-11px;left:12px;background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:2px 9px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.check .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.check .box.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.peers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.peer{display:flex;gap:12px;align-items:center;background:var(--panel);border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(36,34,31,.05)}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.peer small{display:block;color:var(--muted);font-size:13px}
details.why{margin:0 0 12px}details.why summary{cursor:pointer;font-weight:600;padding:8px 0}
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px}
#opener{background:#F7F3EC;color:#24221F;flex-direction:column;text-align:center;cursor:pointer;transition:opacity .5s}
#opener .wc{position:absolute;inset:0;width:100%;height:100%}
#opener .in{position:relative;max-width:560px}
#opener small{display:block;font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--red);margin-bottom:12px}
#opener h3{font-size:44px;line-height:1.1;margin-bottom:12px}
#opener p{font-size:19px;color:#5A534A}
#opener .tap{position:absolute;bottom:28px;left:0;right:0;font-size:13px;color:#8A8278}
.modal{background:rgba(20,18,16,.55);align-items:flex-start;overflow:auto}
.mbox{background:var(--bg);border-radius:18px;max-width:980px;width:100%;padding:22px;margin-top:calc(env(safe-area-inset-top,0px) + 8px)}
.fwgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.fwhead{background:var(--panel);border-radius:12px;padding:12px 14px;margin-bottom:8px}.fwhead b{display:block;font-size:17px}
.fwpr{background:var(--panel);border-radius:12px;padding:2px 14px;margin:0 0 8px}
.fwpr summary{padding:11px 0;font-weight:600;cursor:pointer}.fwpr ul{margin:0 0 10px 18px;padding:0;font-size:14.5px;color:var(--muted)}.fwpr li{margin:4px 0}
.suspense{text-align:center;padding:30px 10px}
.suspense .dots{display:flex;gap:10px;justify-content:center;margin:18px 0 22px}
.suspense .dots span{width:16px;height:16px;border-radius:50%;background:var(--ink);opacity:0;animation:pop .4s forwards}
.suspense .dots span.l{background:var(--stone)}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.cardimg{width:100%;max-width:360px;border-radius:14px;box-shadow:0 6px 24px rgba(36,34,31,.18);display:block;margin:10px auto}
.ok{margin-top:8px;font-size:14.5px;min-height:20px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (max-width:640px){.statement{font-size:25px}.big{font-size:20px}.map{grid-template-columns:1fr 1fr}.views{grid-template-columns:1fr}.steps li{font-size:0;padding-top:0}.fwgrid{grid-template-columns:1fr}.peers{grid-template-columns:1fr}#opener h3{font-size:34px}h2{font-size:25px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
